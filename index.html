<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with Set Operators</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                
                <!-- Main Card Container -->
                <div class="glass-card">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div>
                            <h3 class="fw-bold mb-0">Club Member Portal</h3>
                        </div>
                    </div>

                    <p class="text-secondary mb-4">Add new student club members using PyScript set union operators.</p>

                    <!-- Member Input Form -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label-custom" for="first_name">First Name</label>
                            <input type="text" id="first_name" class="form-control custom-input" placeholder="First Name" value="Elise">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label-custom" for="last_name">Last Name</label>
                            <input type="text" id="last_name" class="form-control custom-input" placeholder="Last Name" value="Lim">
                        </div>
                        <div class="col-12 mt-3">
                            <button id="submit_btn" class="btn btn-submit-custom" py-click="add_member">
                                Add Member to Club
        </button>
            </div>
                    </div>

                    <!-- Output display container -->
                    <div id="output-container"></div>
                </div>

            </div>
        </div>
    </div>
    <script type="py" src="main.py"></script>

</body>
</html>
